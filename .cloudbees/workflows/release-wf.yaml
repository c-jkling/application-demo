apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Release WF

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: System-generated manifest for releases

metadata:
  stages/v1alpha1:
    - name: Development
      jobs:
        - Development
    - name: Staging
      jobs:
        - Approve-Staging
        - Staging
    - name: Production
      jobs:
        - Production

jobs:
  Development:
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      environment: Development
      manifest: ${{ inputs.manifest }}

  Approve-Staging:
    needs: [Development]
    steps:
      - name: Manual approval for Staging
        uses: cloudbees-io/gate@v1
        with:
          description: Approve deployment to Staging

  Staging:
    needs: [Approve-Staging]
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      environment: Staging
      manifest: ${{ inputs.manifest }}

  Production:
    needs: [Staging]
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      environment: Production
      manifest: ${{ inputs.manifest }}
