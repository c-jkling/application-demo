apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:
  josh-sample-go-app:
    if: ${{ fromJSON(inputs.manifest)['josh-sample-go-app']['joshkling/my-sample-go-app'].deploy }}
    uses: c-jkling/josh-sample-go-app/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['josh-sample-go-app']['joshkling/my-sample-go-app'].id }}
      environment: ${{ inputs.environment }}
